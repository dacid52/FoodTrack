workflows:
  ios-unsigned-ipa:
    name: iOS unsigned IPA
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      groups:
        - app
      node: 22.11.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Generate iOS native project
        script: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update

      - name: Build unsigned .app
        script: |
          cd ios
          xcodebuild -workspace FoodTrack.xcworkspace -scheme FoodTrack \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package unsigned IPA
        script: |
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then echo "No .app found"; exit 1; fi
          echo "Found app: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry FoodTrack-unsigned.ipa Payload
          ls -lh FoodTrack-unsigned.ipa
    artifacts:
      - FoodTrack-unsigned.ipa
