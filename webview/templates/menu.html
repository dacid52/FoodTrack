<!-- ================= VIEW 3: MENU QUÁN (QUẢN LÝ MÓN - KHÔNG DANH MỤC) ================= -->
    <section class="p-3.5 space-y-3 pb-6 hidden max-w-2xl mx-auto w-full" id="view-menu">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <h2 class="text-base font-bold text-neutral-900">Menu</h2>
          <span class="px-2 py-0.5 bg-neutral-100 rounded-full text-xs font-semibold text-neutral-600" id="menu-total-count">0 món</span>
        </div>
        <button class="px-3 py-1.5 rounded-xl bg-neutral-900 text-white font-semibold text-xs flex items-center gap-1 shadow-sm active:scale-95 transition-transform" onclick="openEditMenuModal(null)">
          <span class="material-symbols-outlined text-[16px]">add</span>
          Thêm món
        </button>
      </div>
      <div class="relative">
        <span class="material-symbols-outlined text-neutral-400 absolute left-3 top-2.5 text-[18px]">search</span>
        <input class="w-full bg-white pl-9 pr-4 py-2 rounded-xl border border-neutral-200 text-xs focus:outline-none focus:border-primary text-neutral-800 placeholder-neutral-400" id="menu-search-input" oninput="filterMenuItems()" placeholder="Tìm món trong thực đơn..." type="text">
      </div>
      <div class="flex gap-1.5 text-xs font-medium">
        <button class="px-3 py-1 rounded-lg bg-neutral-900 text-white transition-colors font-semibold whitespace-nowrap" id="menu-filter-all" onclick="setMenuStatusFilter('all')">Tất cả</button>
        <button class="px-3 py-1 rounded-lg bg-white border border-neutral-200 text-neutral-600 hover:bg-neutral-50 transition-colors whitespace-nowrap" id="menu-filter-active" onclick="setMenuStatusFilter('active')">Đang bán (<span id="menu-active-count">0</span>)</button>
        <button class="px-3 py-1 rounded-lg bg-white border border-neutral-200 text-neutral-600 hover:bg-neutral-50 transition-colors whitespace-nowrap" id="menu-filter-inactive" onclick="setMenuStatusFilter('inactive')">Tạm ngưng (<span id="menu-inactive-count">0</span>)</button>
      </div>
      <div class="space-y-2" id="menu-items-list"></div>
    </section>
