<!-- ================= VIEW 4: THỐNG KÊ (LỢI NHUẬN LÀ CHỈ SỐ NỔI BẬT NHẤT) ================= -->
    <section class="p-3.5 space-y-3 pb-4 hidden max-w-2xl mx-auto w-full" id="view-stats">
      <!-- Header + Điều hướng kỳ gọn cố định 1 hàng (không đẩy card lên xuống) -->
      <div class="space-y-2.5">
        <div class="flex items-center justify-between gap-2">
          <div class="min-w-0">
            <h2 class="text-base font-bold text-neutral-900 leading-tight">Báo cáo tài chính</h2>
            <p class="text-[11px] text-neutral-500 font-medium truncate mt-0.5" id="stats-filter-period-label">Tháng này</p>
          </div>
          <div class="shrink-0 flex items-center gap-0.5 bg-white border border-neutral-200/80 rounded-xl p-0.5 shadow-sm" id="stats-period-picker-bar">
            <button type="button" class="w-7 h-7 rounded-lg flex items-center justify-center text-neutral-600 hover:bg-neutral-100 active:scale-90 transition-transform" onclick="changeStatsMonth(-1)" aria-label="Kỳ trước">
              <span class="material-symbols-outlined text-[16px]">chevron_left</span>
            </button>
            <button type="button" class="px-2 py-1 rounded-lg text-[11px] font-bold text-neutral-800 hover:bg-neutral-100 active:scale-95 transition-colors whitespace-nowrap tabular-nums" id="stats-current-month" onclick="resetStatsOffset()" title="Về kỳ hiện tại">Tháng này</button>
            <button type="button" class="w-7 h-7 rounded-lg flex items-center justify-center text-neutral-600 hover:bg-neutral-100 active:scale-90 transition-transform disabled:opacity-30 disabled:pointer-events-none" id="stats-next-btn" onclick="changeStatsMonth(1)" aria-label="Kỳ sau">
              <span class="material-symbols-outlined text-[16px]">chevron_right</span>
            </button>
          </div>
        </div>

        <!-- Bộ lọc cố định: Ngày | Tuần | Tháng -->
        <div class="relative flex gap-1 p-1 bg-neutral-100 rounded-xl text-xs font-medium text-neutral-600 select-none" id="stats-tab-bar">
          <div class="ft-pill absolute top-1 bottom-1 left-0 bg-white rounded-lg shadow-sm pointer-events-none" id="stats-tab-pill"></div>
          <button type="button" class="flex-1 relative py-1.5 rounded-lg text-neutral-500 hover:text-neutral-900 text-center text-xs transition-colors" id="stats-tab-day" onclick="setStatsPeriod('day')">Ngày</button>
          <button type="button" class="flex-1 relative py-1.5 rounded-lg text-neutral-500 hover:text-neutral-900 text-center text-xs transition-colors" id="stats-tab-week" onclick="setStatsPeriod('week')">Tuần</button>
          <button type="button" class="flex-1 relative py-1.5 rounded-lg font-semibold text-neutral-900 text-center text-xs transition-colors" id="stats-tab-month" onclick="setStatsPeriod('month')">Tháng</button>
        </div>
      </div>

      <!-- CARD LỢI NHUẬN NỔI BẬT ĐỒNG BỘ PHONG CÁCH THAN XÁM VỚI TRANG TỔNG QUAN -->
      <div class="bg-gradient-to-br from-[#32343a] via-[#25262b] to-[#1a1b1e] rounded-2xl shadow-sm overflow-hidden" id="stats-hero-card">
        <div class="p-4 pb-3.5">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-emerald-400 transition-colors duration-200" id="stats-hero-dot"></span>
              <span class="text-[11px] font-bold uppercase tracking-wider text-neutral-300/80" id="stats-hero-label">LỢI NHUẬN THÁNG NÀY</span>
            </div>
            <span class="px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-white/10 text-neutral-200 tabular-nums" id="stats-total-orders">0 đơn</span>
          </div>

          <div class="mt-2.5 flex items-baseline gap-1.5">
            <span class="text-[30px] sm:text-[32px] font-bold tracking-normal leading-none text-white tabular-nums transition-colors duration-200" id="stats-net-revenue">0</span>
            <span class="text-base font-semibold text-neutral-400">đ</span>
          </div>
        </div>

        <!-- Đường kẻ tỷ trọng liền mạch siêu mảnh (2px) -->
        <div class="h-[2px] w-full bg-white/10 flex overflow-hidden">
          <div class="h-full bg-emerald-400/80 transition-[width] duration-300" id="stats-bar-revenue" style="width: 0%"></div>
          <div class="h-full bg-orange-400/80 transition-[width] duration-300" id="stats-bar-goods" style="width: 0%"></div>
          <div class="h-full bg-slate-300/75 transition-[width] duration-300" id="stats-bar-other" style="width: 0%"></div>
        </div>

        <!-- 3 CHỈ SỐ THÀNH PHẦN ĐỒNG BỘ MÀU VỚI ĐƯỜNG TỶ TRỌNG -->
        <div class="grid grid-cols-3 divide-x divide-white/10 bg-black/20">
          <div class="px-2.5 py-2.5 min-w-0">
            <div class="flex items-center gap-1.5">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400/85 shrink-0"></span>
              <p class="text-[10px] font-semibold text-neutral-400 truncate">Doanh thu</p>
            </div>
            <p class="text-[13px] font-bold tracking-normal text-emerald-300 mt-1 leading-tight whitespace-nowrap tabular-nums"><span id="stats-total-revenue">0</span><span class="text-[9px] font-semibold text-neutral-500 ml-0.5">đ</span></p>
          </div>
          <div class="px-2.5 py-2.5 min-w-0">
            <div class="flex items-center gap-1.5">
              <span class="w-1.5 h-1.5 rounded-full bg-orange-400/85 shrink-0"></span>
              <p class="text-[10px] font-semibold text-neutral-400 truncate">Nhập hàng</p>
            </div>
            <p class="text-[13px] font-bold tracking-normal text-orange-300 mt-1 leading-tight whitespace-nowrap tabular-nums"><span id="stats-cost-goods">0</span><span class="text-[9px] font-semibold text-neutral-500 ml-0.5">đ</span></p>
          </div>
          <div class="px-2.5 py-2.5 min-w-0">
            <div class="flex items-center gap-1.5">
              <span class="w-1.5 h-1.5 rounded-full bg-slate-300/80 shrink-0"></span>
              <p class="text-[10px] font-semibold text-neutral-400 truncate">Chi khác</p>
            </div>
            <p class="text-[13px] font-bold tracking-normal text-slate-200 mt-1 leading-tight whitespace-nowrap tabular-nums"><span id="stats-cost-other">0</span><span class="text-[9px] font-semibold text-neutral-500 ml-0.5">đ</span></p>
          </div>
        </div>
      </div>

      <!-- BIỂU ĐỒ THU – CHI (Trực quan, vuông vức, nhìn là hiểu ngay) -->
      <div class="bg-white rounded-2xl border border-neutral-200/80 shadow-sm p-3.5" id="stats-profit-chart-card">
        <div class="flex items-center justify-between gap-2 mb-2.5">
          <h3 class="text-xs font-bold text-neutral-900 leading-tight" id="stats-chart-title">Biểu đồ</h3>
          <span class="text-[11px] text-neutral-400 font-medium truncate tabular-nums" id="stats-chart-subtitle">—</span>
        </div>

        <!-- Dải số liệu chi tiết của cột đang chọn (chế độ Tuần & Tháng — không hiện số đơn) -->
        <div class="rounded-xl bg-neutral-50 border border-neutral-200/70 px-3 py-2.5 mb-3" id="stats-chart-detail">
          <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-1.5 min-w-0">
              <p class="text-xs font-bold text-neutral-900 truncate" id="stats-detail-title">—</p>
              <button type="button" class="hidden shrink-0 text-[10px] font-semibold text-neutral-500 hover:text-neutral-900 bg-white border border-neutral-200/80 rounded-md px-1.5 py-0.5 active:scale-95 transition-all" id="stats-detail-drill-btn" onclick="drillIntoSelectedStatsDay()">Xem ngày ›</button>
            </div>
            <span class="text-xs font-extrabold shrink-0 tabular-nums text-neutral-700" id="stats-detail-profit">0 đ</span>
          </div>
          <div class="mt-2 pt-2 border-t border-neutral-200/60 grid grid-cols-3 gap-2 text-[10px] tabular-nums" id="stats-detail-metrics">
            <div class="min-w-0">
              <span class="text-neutral-400 font-medium flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500 shrink-0"></span>Thu</span>
              <p class="font-bold text-emerald-700 truncate mt-0.5" id="stats-detail-rev">0 đ</p>
            </div>
            <div class="min-w-0">
              <span class="text-neutral-400 font-medium flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-orange-400 shrink-0"></span>Nhập hàng</span>
              <p class="font-bold text-orange-600 truncate mt-0.5" id="stats-detail-goods">0 đ</p>
            </div>
            <div class="min-w-0">
              <span class="text-neutral-400 font-medium flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-slate-400 shrink-0"></span>Chi khác</span>
              <p class="font-bold text-slate-600 truncate mt-0.5" id="stats-detail-other">0 đ</p>
            </div>
          </div>
        </div>

        <!-- Khu vực vẽ biểu đồ (Cột ngang cho Ngày / Cột dọc đôi cho Tuần & Tháng) -->
        <div id="stats-daily-list"></div>
      </div>
    </section>
